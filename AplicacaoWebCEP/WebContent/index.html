<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuscaCEP | Consulte um endereço</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="page-shell">
    <section class="hero-card">
        <div class="brand-mark" aria-hidden="true">⌖</div>
        <p class="eyebrow">CONSULTA DE ENDEREÇO</p>
        <h1>Encontre um endereço pelo CEP</h1>
        <p class="subtitle">Digite o CEP para consultar rua, bairro, cidade e estado em poucos segundos.</p>
        <form class="search-form" id="cep-form">
            <label for="cep">CEP</label>
            <div class="input-row">
                <input type="text" id="cep" inputmode="numeric" maxlength="9"
                       placeholder="00000-000" autocomplete="postal-code"
                       pattern="[0-9]{5}-?[0-9]{3}" required>
                <button type="submit">Consultar <span aria-hidden="true">→</span></button>
            </div>
            <small>Informe os 8 dígitos do CEP, com ou sem hífen.</small>
        </form>
        <div id="message" class="alert" role="alert" hidden></div>
        <div id="result-content" class="address-grid" hidden></div>
    </section>
    <footer>Dados fornecidos por <a href="https://viacep.com.br/" target="_blank" rel="noopener">ViaCEP</a></footer>
</main>
<script>
(function () {
    var form = document.getElementById("cep-form");
    var input = document.getElementById("cep");
    var message = document.getElementById("message");
    var result = document.getElementById("result-content");

    input.addEventListener("input", function () {
        var digits = input.value.replace(/\D/g, "").slice(0, 8);
        input.value = digits.length > 5 ? digits.slice(0, 5) + "-" + digits.slice(5) : digits;
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var cep = input.value.replace(/\D/g, "");
        message.hidden = true;
        result.hidden = true;
        if (!/^\d{8}$/.test(cep)) {
            showMessage("Digite um CEP válido com 8 dígitos.");
            return;
        }

        var button = form.querySelector("button");
        button.disabled = true;
        button.textContent = "Consultando...";
        fetch("https://viacep.com.br/ws/" + cep + "/json/")
            .then(function (response) {
                if (!response.ok) throw new Error("Falha na consulta");
                return response.json();
            })
            .then(function (data) {
                if (data.erro) {
                    showMessage("CEP não encontrado. Confira os números e tente novamente.");
                    return;
                }
                result.innerHTML = [
                    ["Logradouro", data.logradouro], ["Bairro", data.bairro],
                    ["Cidade", data.localidade], ["Estado", data.uf],
                    ["CEP", data.cep], ["DDD", data.ddd]
                ].map(function (field) {
                    return "<div class=\"address-field\"><span>" + field[0] +
                        "</span><strong>" + (field[1] || "Não informado") + "</strong></div>";
                }).join("");
                result.hidden = false;
            })
            .catch(function () {
                showMessage("Não foi possível consultar agora. Tente novamente.");
            })
            .finally(function () {
                button.disabled = false;
                button.innerHTML = "Consultar <span aria-hidden=\"true\">→</span>";
            });
    });

    function showMessage(text) {
        message.textContent = text;
        message.hidden = false;
    }
}());
</script>
</body>
</html>
